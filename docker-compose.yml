services:
  # Institutional School Database (MySQL)
  db:
    image: mysql:8.0
    container_name: mysql-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: smart_school
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Redis for Celery & Caching
  redis:
    image: redis:7.0-alpine
    container_name: redis-cache
    restart: always
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: visio-backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      # Override local development vars with Docker service names
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_NAME=smart_school
      - DATABASE_URL=mysql://root:root@db:3306/smart_school
      - CELERY_BROKER_URL=redis://redis:6379/0
      - WAHA_BASE_URL=http://waha:3000
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-https://visio.school,https://www.visio.school,https://api.visio.school,http://localhost:3000,http://127.0.0.1:3000}
    volumes:
      - backend_faces:/app/faces
      - backend_teacher_faces:/app/teacher_faces
      - backend_static:/app/static
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Use NEXT_PUBLIC_API_URL from .env during build
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.visio.school}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://api.visio.school/ws/attendance}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
    container_name: visio-frontend
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env
    environment:
      # Inject exact URLs from frontend/.env
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://api.visio.school}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-ws://api.visio.school/ws/attendance}
      - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
    depends_on:
      - backend

  # WAHA (WhatsApp HTTP API)
  waha:
    image: devlikeapro/waha
    container_name: waha
    restart: always
    env_file:
      - ./backend/.env
    environment:
      - WAHA_WEBHOOK_URL=http://backend:8000/webhook/waha
      - WAHA_WEBHOOK_EVENTS=message
      - WAHA_API_KEY=visio_waha_secure_key_123
    ports:
      - "3001:3000"
    depends_on:
      - backend

volumes:
  mysql_data:
  backend_faces:
  backend_teacher_faces:
  backend_static: